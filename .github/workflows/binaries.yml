name: binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make dist
      - name: verify the linux/amd64 archive runs
        run: |
          tar -xzf dist/cinc-collector-linux-amd64.tar.gz -C /tmp
          /tmp/cinc-collector-linux-amd64/cinc-collector version
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
