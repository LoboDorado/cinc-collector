apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-egress
  labels:
    app.kubernetes.io/name: cinc-collector
spec:
  policyTypes: ["Ingress", "Egress"]
  ingress:
  - ports:
    - port: 80
      protocol: TCP
    - port: 8891
      protocol: TCP
  egress:
  - ports:
    # SereneDB (Postgres wire protocol) -- see values.yaml's serenedbPort if
    # your instance listens on something other than 5432.
    - port: {{ .Values.serenedbPort | default 5432 }}
      protocol: TCP
    # S3/S3-compatible profile storage, and any other outbound HTTPS.
    - port: 443
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cinc-collector
