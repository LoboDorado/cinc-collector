{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cinc-collector.fullname" . }}
  labels:
    {{- include "cinc-collector.labels" . | nindent 4 }}
type: Opaque
data:
  CINC_COLLECTOR_DB_DSN: {{ required "dbDsn is required (or set existingSecret)" .Values.dbDsn | b64enc | quote }}
  {{- if .Values.stats.password }}
  CINC_COLLECTOR_STATS_PASSWORD: {{ .Values.stats.password | b64enc | quote }}
  {{- end }}
{{- end }}
