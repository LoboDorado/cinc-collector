# Minimal working configuration against S3-compatible storage.
#   helm install cinc-collector ./deploy/helm/cinc-collector \
#     -f values-example.yaml \
#     --set dbDsn="postgres://user:password@serenedb.example.com:5432/postgres?sslmode=disable"

profileStorage: s3
s3:
  bucket: inspec-profiles
  endpoint: https://s3.example.com
  region: us-east-1

ingress:
  enabled: true
  className: nginx
  host: cinc-collector.example.com
  tls:
    - secretName: cinc-collector-tls
      hosts:
        - cinc-collector.example.com
